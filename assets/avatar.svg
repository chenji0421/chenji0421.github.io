<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- 渐变圆角底 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>

  <!-- 背景装饰：圆环 + 小圆点，增加层次感 -->
  <circle cx="126" cy="34" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5"/>
  <circle cx="30" cy="128" r="14" fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="132" cy="126" r="5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- 终端风格首字母：C + 光标块 -->
  <text x="76" y="108" font-family="ui-monospace, 'SF Mono', Consolas, monospace"
        font-size="74" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="112" y="76" width="9" height="58" rx="3" fill="#ffffff" opacity="0.85"/>
</svg>
