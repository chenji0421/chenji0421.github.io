# CI：每次 push / PR 自动跑一遍检查
# 检查项：
#   1. scripts/check.py 本身语法正确
#   2. 运行 scripts/check.py —— 关键文件 / HTML 配对 / 数据完整性 / 密钥扫描
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-check:
    name: 站点自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 语法检查
        run: python -m py_compile scripts/check.py

      - name: 运行项目自检脚本
        run: python scripts/check.py
