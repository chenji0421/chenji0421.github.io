# 本地全栈体验三件套：前端 + 后端 + PostgreSQL
#
# 用法：docker compose up --build
#
# 注意：
#   - 这只是【本地学习 / 展示】用的，GitHub Pages 不跑 Docker。
#   - 后端默认读环境变量 DATABASE_URL 连 PostgreSQL；
#     不在 Docker 里跑的时候，默认退回 SQLite。
#   - 所有配置只是示例，正式使用请在 .env 里覆盖。

services:
  # ---- 数据库（未来升级方向）----
  postgres:
    image: postgres:16-alpine
    container_name: chenji-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chenji
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- FastAPI 后端 ----
  backend:
    build: ./backend
    container_name: chenji-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/chenji
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- React 前端（开发服务器，热更新）----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chenji-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # 保留容器里装的依赖，不被本机覆盖
    depends_on:
      - backend

volumes:
  pgdata:
